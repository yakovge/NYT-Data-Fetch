# Service Level Objectives (SLO) Configuration
# Defines performance targets and error budgets for the NYT scraper

# Global SLO settings
global:
  # Error budget burn rate threshold (0.0-1.0)
  # Alert when burning through error budget too fast
  burn_rate_threshold: 0.1
  
  # Time windows for SLO evaluation
  evaluation_windows:
    short_term: "1h"      # 1 hour for immediate alerts
    medium_term: "6h"     # 6 hours for trend monitoring  
    long_term: "24h"      # 24 hours for daily reporting
    
  # Alert notification settings
  alerts:
    enabled: true
    cooldown_minutes: 30
    escalation_minutes: 120

# Discovery Layer SLOs
discovery:
  rss_fetch_success:
    description: "RSS feed fetching success rate"
    target: 0.99           # 99% success rate
    time_window: "24h"
    error_budget_burn_rate: 0.05
    alerts:
      - threshold: 0.95    # Alert if success rate drops below 95%
        severity: "warning"
      - threshold: 0.90    # Critical alert if below 90%
        severity: "critical"
    
  sitemap_parse_success:
    description: "Sitemap parsing success rate"
    target: 0.98           # 98% success rate
    time_window: "24h"
    error_budget_burn_rate: 0.08
    alerts:
      - threshold: 0.95
        severity: "warning"
      - threshold: 0.90
        severity: "critical"
    
  search_fallback_success:
    description: "Search engine fallback success rate"
    target: 0.95           # 95% success rate (external dependency)
    time_window: "24h"
    error_budget_burn_rate: 0.10
    alerts:
      - threshold: 0.90
        severity: "warning"
      - threshold: 0.85
        severity: "critical"

# Fetching Layer SLOs  
fetching:
  http_request_success:
    description: "HTTP request success rate"
    target: 0.95           # 95% success rate
    time_window: "24h"
    error_budget_burn_rate: 0.10
    exclude_status_codes: [404, 403, 429]  # Don't count these as failures
    alerts:
      - threshold: 0.92
        severity: "warning"
      - threshold: 0.88
        severity: "critical"
    
  response_time_p95:
    description: "95th percentile HTTP response time"
    target: 2000           # 2 seconds
    time_window: "1h"
    unit: "milliseconds"
    alerts:
      - threshold: 3000    # 3 seconds
        severity: "warning"
      - threshold: 5000    # 5 seconds
        severity: "critical"
        
  cache_hit_rate:
    description: "Cache hit rate for repeated requests"
    target: 0.60           # 60% cache hit rate
    time_window: "6h"
    error_budget_burn_rate: 0.15
    alerts:
      - threshold: 0.50
        severity: "warning"
      - threshold: 0.40
        severity: "critical"

# Parsing Layer SLOs
parsing:
  deterministic_success_rate:
    description: "Success rate of deterministic parsing (no AI)"
    target: 0.90           # 90% success without AI
    time_window: "24h"
    error_budget_burn_rate: 0.05
    alerts:
      - threshold: 0.85
        severity: "warning"
      - threshold: 0.80
        severity: "critical"
    
  micro_ai_usage_rate:
    description: "Micro AI usage rate (should stay low)"
    target: 0.10           # Max 10% usage
    time_window: "24h"
    invert_target: true    # Alert when ABOVE target
    error_budget_burn_rate: 0.20
    alerts:
      - threshold: 0.15    # Alert if usage exceeds 15%
        severity: "warning"
      - threshold: 0.25    # Critical if exceeds 25%
        severity: "critical"
        
  heavy_ai_usage_rate:
    description: "Heavy AI usage rate (should be minimal)"
    target: 0.005          # Max 0.5% usage
    time_window: "24h"
    invert_target: true
    error_budget_burn_rate: 0.50
    alerts:
      - threshold: 0.01    # Alert if usage exceeds 1%
        severity: "warning"
      - threshold: 0.02    # Critical if exceeds 2%
        severity: "critical"
        
  content_validation_pass_rate:
    description: "Content validation success rate"
    target: 0.95           # 95% of content passes validation
    time_window: "24h"
    error_budget_burn_rate: 0.10
    alerts:
      - threshold: 0.90
        severity: "warning"
      - threshold: 0.85
        severity: "critical"

# Storage Layer SLOs
storage:
  write_success_rate:
    description: "Database write success rate"
    target: 0.999          # 99.9% success rate
    time_window: "24h"
    error_budget_burn_rate: 0.01
    alerts:
      - threshold: 0.995
        severity: "warning"
      - threshold: 0.990
        severity: "critical"
        
  deduplication_accuracy:
    description: "Deduplication accuracy rate"
    target: 0.98           # 98% accuracy in detecting duplicates
    time_window: "24h"
    error_budget_burn_rate: 0.05
    alerts:
      - threshold: 0.95
        severity: "warning"
      - threshold: 0.90
        severity: "critical"
        
  search_query_performance:
    description: "Search query response time (P95)"
    target: 100            # 100ms
    time_window: "1h"
    unit: "milliseconds"
    alerts:
      - threshold: 200     # 200ms
        severity: "warning"
      - threshold: 500     # 500ms
        severity: "critical"

# AI Budget SLOs
ai_budget:
  daily_token_utilization:
    description: "Daily AI token budget utilization"
    target: 0.80           # Max 80% of daily budget
    time_window: "24h"
    invert_target: true    # Alert when ABOVE target
    reset_schedule: "daily"
    alerts:
      - threshold: 0.85    # Alert at 85% usage
        severity: "warning"
      - threshold: 0.95    # Critical at 95% usage
        severity: "critical"
        
  micro_ai_token_rate:
    description: "Micro AI tokens per successful parse"
    target: 150            # Average 150 tokens per micro-AI call
    time_window: "6h"
    unit: "tokens"
    alerts:
      - threshold: 200     # Alert if exceeding 200 tokens
        severity: "warning"
      - threshold: 300     # Critical if exceeding 300 tokens
        severity: "critical"
        
  heavy_ai_response_time:
    description: "Heavy AI processing time"
    target: 5000           # 5 seconds
    time_window: "1h"
    unit: "milliseconds"
    alerts:
      - threshold: 8000    # 8 seconds
        severity: "warning"
      - threshold: 15000   # 15 seconds
        severity: "critical"

# Compliance SLOs
compliance:
  robots_txt_compliance:
    description: "Robots.txt compliance rate"
    target: 1.0            # 100% compliance (zero tolerance)
    time_window: "24h"
    error_budget_burn_rate: 0.0
    alerts:
      - threshold: 0.999   # Alert on any violation
        severity: "critical"
        
  paywall_detection_accuracy:
    description: "Paywall detection accuracy"
    target: 0.95           # 95% accuracy in detecting paywalls
    time_window: "24h"
    error_budget_burn_rate: 0.10
    alerts:
      - threshold: 0.90
        severity: "warning"
      - threshold: 0.85
        severity: "critical"
        
  challenge_detection_rate:
    description: "Challenge/CAPTCHA detection rate"
    target: 0.98           # 98% accuracy in detecting challenges
    time_window: "24h"
    error_budget_burn_rate: 0.05
    alerts:
      - threshold: 0.95
        severity: "warning"
      - threshold: 0.90
        severity: "critical"
        
  rate_limit_compliance:
    description: "Rate limiting compliance (requests within limits)"
    target: 1.0            # 100% compliance
    time_window: "1h"
    error_budget_burn_rate: 0.0
    alerts:
      - threshold: 0.99    # Alert on any rate limit violation
        severity: "critical"

# End-to-End SLOs
end_to_end:
  article_processing_success:
    description: "End-to-end article processing success rate"
    target: 0.85           # 85% of discovered articles successfully processed
    time_window: "24h"
    error_budget_burn_rate: 0.10
    alerts:
      - threshold: 0.80
        severity: "warning"
      - threshold: 0.75
        severity: "critical"
        
  processing_latency_p90:
    description: "90th percentile end-to-end processing time"
    target: 10000          # 10 seconds
    time_window: "1h"
    unit: "milliseconds"
    alerts:
      - threshold: 15000   # 15 seconds
        severity: "warning"
      - threshold: 30000   # 30 seconds
        severity: "critical"
        
  daily_article_yield:
    description: "Daily new articles successfully scraped"
    target: 100            # Minimum 100 articles per day
    time_window: "24h"
    unit: "count"
    alerts:
      - threshold: 80      # Alert if below 80 articles
        severity: "warning"
      - threshold: 50      # Critical if below 50 articles
        severity: "critical"

# System Health SLOs
system:
  memory_utilization:
    description: "Peak memory utilization"
    target: 0.80           # Max 80% memory usage
    time_window: "1h"
    invert_target: true
    alerts:
      - threshold: 0.90    # Alert at 90% memory usage
        severity: "warning"
      - threshold: 0.95    # Critical at 95% memory usage
        severity: "critical"
        
  error_rate:
    description: "Overall system error rate"
    target: 0.05           # Max 5% error rate
    time_window: "1h"
    invert_target: true
    alerts:
      - threshold: 0.10    # Alert at 10% error rate
        severity: "warning"
      - threshold: 0.20    # Critical at 20% error rate
        severity: "critical"
        
  uptime:
    description: "System uptime percentage"
    target: 0.999          # 99.9% uptime
    time_window: "24h"
    error_budget_burn_rate: 0.01
    alerts:
      - threshold: 0.995   # Alert at 99.5% uptime
        severity: "warning"
      - threshold: 0.990   # Critical at 99.0% uptime
        severity: "critical"

# Alert routing configuration
alert_routing:
  channels:
    slack:
      webhook_url_env: "SLACK_WEBHOOK_URL"
      format: "json"
      fields: ["slo_name", "current_value", "target", "severity", "time_window"]
      
    email:
      smtp_config_env: "EMAIL_SMTP_CONFIG"
      recipients_env: "EMAIL_ALERTS_TO"
      format: "html"
      
    webhook:
      url_env: "ALERT_WEBHOOK_URL"
      format: "json"
      include_context: true
      
  routing_rules:
    - severity: "critical"
      channels: ["slack", "email", "webhook"]
      cooldown_minutes: 15
      
    - severity: "warning"
      channels: ["slack", "webhook"]  
      cooldown_minutes: 30
      
    - time_window: "1h"
      channels: ["webhook"]
      cooldown_minutes: 60

# SLO calculation methods
calculation:
  # How to handle missing data points
  missing_data_policy: "assume_failure"  # or "assume_success", "interpolate"
  
  # Minimum sample size for SLO evaluation
  minimum_sample_size: 10
  
  # How often to recalculate SLOs
  evaluation_frequency: "5m"
  
  # Retention period for SLO data
  retention_period: "30d"